<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ image.word }} (Sketch by {{ image.drawer_name }}) | KIG Network</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous">

    <meta name="description"
        content="View this drawing of {{ image.word }} by {{ image.drawer_name }}. Play Sketch on playkig.com!">
    <meta name="og:title" content="{{ image.word }} (Sketch by {{ image.drawer_name }}) | KIG Network">
    <meta name="og:image" content="{{ image_url }}">
    <meta name="og:description"
        content="View this drawing of {{ image.word }} by {{ image.drawer_name }}. Play Sketch on playkig.com!">
    <meta name="og:site_name" content="KIG Network">
    <meta name="twitter:card" content="summary">
    <meta name="og:type" content="website">
    <meta name="theme-color" content="#f7b32a">
</head>

<body class="d-flex container justify-content-center align-items-center text-center" style="height: 100vh;">
    <div class="d-flex flex-column">
        <main class="flex-shrink-0">
            <div class="">
                <h2>
                    {{ image.word }}
                    <small class="text-body-secondary">by
                        <img src="https://crafthead.net/helm/{{ image.drawer_id }}" width="32" height="32" />
                        <span>{{ image.drawer_name }}</span>
                    </small>
                </h2>
                <div class="my-4">
                    <img src="{{ image_url }}" class="shadow-lg border border-2" />
                </div>
                <h4>Make your own Sketch on <strong><a class="text-dark" href="https://playkig.com">KIG
                            Network!</a></strong></h4>
            </div>
        </main>

        <footer class="footer text-center text-lg-start mt-4">
            <div class="text-center p-3">
                © 2020-{{ current_year }} KIG Network:
                <a class="text-dark" href="https://playkig.com">playkig.com</a>.
                Licensed under the <a class="text-dark" href="https://www.gnu.org/licenses/agpl-3.0.en.html">GNU
                    AGPLv3</a>.
                <a class="text-dark" href="https://github.com/ProjectKig/kig-web">Source</a>
            </div>
        </footer>
    </div>

</body>

</html>
